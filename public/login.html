<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar · JIJAZOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="pagina-login">
  <main class="login-caja">
    <div class="marca">
      <span class="marca-logo">JIJAZOS</span>
      <span class="marca-sub">Apuestas fuertes · stake 15%+</span>
    </div>

    <form id="form-login" class="login-form" autocomplete="on">
      <label>
        Usuario
        <input type="text" id="usuario" name="usuario" required autofocus>
      </label>
      <label>
        Contraseña
        <input type="password" id="contrasena" name="contrasena" required>
      </label>
      <p id="login-error" class="error" hidden></p>
      <button type="submit" class="btn btn-primario btn-grande">Entrar</button>
    </form>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
